name: OCR

# The OCR service: takes PDFs from a folder in a private storage repository and
# puts the searchable results in another; PDFs too large for git are taken from
# the repository's releases. Configure it with the STORAGE_REPO and
# STORAGE_TOKEN secrets (see README). Logs never contain file, folder or
# release names.

on:
  workflow_dispatch:
    inputs:
      language:
        description: Language code such as eng or chi_sim (empty = OCR_LANGUAGE variable, then eng)
        required: false
        type: string
      mode:
        description: "skip: leave pages that already have text alone. force: OCR every page"
        type: choice
        options: [skip, force]
        default: skip
      branch:
        description: Branch of the storage repository to work on (empty = its default branch)
        required: false
        type: string
      runner:
        description: macOS version to run on
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
      recognition:
        description: "Recognition mode: livetext, accurate or fast"
        type: choice
        options: [livetext, accurate, fast]
        default: livetext

permissions:
  contents: read

# Runs on the default branch queue behind each other; a run for another branch
# has its own queue and may run alongside them.
concurrency:
  group: ocr-${{ inputs.branch }}
  cancel-in-progress: false

env:
  OCR_LANGUAGE: ${{ inputs.language || vars.OCR_LANGUAGE || 'eng' }}
  OCR_RECOGNITION: ${{ inputs.recognition || 'livetext' }}

jobs:
  ocr:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 360  # the most GitHub allows
    steps:
      # The branch name must not show up in this public log. It is read from the
      # event file rather than an env value, because a step prints its env before
      # the mask takes effect.
      - name: Hide the branch name
        run: |
          branch=$(jq -r '.inputs.branch // empty' "$GITHUB_EVENT_PATH")
          [ -z "$branch" ] || echo "::add-mask::$branch"

      - uses: actions/checkout@v7

      - name: Fetch documents
        id: fetch
        env:
          STORAGE_REPO: ${{ secrets.STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_INBOX: ${{ secrets.STORAGE_INBOX }}
          STORAGE_DONE: ${{ secrets.STORAGE_DONE }}
          STORAGE_FAILED: ${{ secrets.STORAGE_FAILED }}
          STORAGE_BRANCH: ${{ inputs.branch }}
        run: scripts/storage.sh fetch "$RUNNER_TEMP/ocr"

      - name: OCR
        uses: ./
        with:
          input: ${{ runner.temp }}/ocr/input
          output: ${{ runner.temp }}/ocr/output
          language: ${{ env.OCR_LANGUAGE }}
          mode: ${{ inputs.mode }}
          recognition: ${{ env.OCR_RECOGNITION }}
          quiet: true

      - name: OCR release files
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          OCR_MODE: ${{ inputs.mode }}
          OCR_QUIET: "true"
        run: |
          [ -d "$RUNNER_TEMP/ocr/release-input" ] || exit 0
          scripts/ocr.sh "$RUNNER_TEMP/ocr/release-input" "$RUNNER_TEMP/ocr/release-output"

      - name: Save results
        id: save
        if: ${{ !cancelled() && steps.fetch.outcome == 'success' }}
        env:
          STORAGE_REPO: ${{ secrets.STORAGE_REPO }}
          STORAGE_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_INBOX: ${{ secrets.STORAGE_INBOX }}
          STORAGE_DONE: ${{ secrets.STORAGE_DONE }}
          STORAGE_FAILED: ${{ secrets.STORAGE_FAILED }}
        run: scripts/storage.sh save "$RUNNER_TEMP/ocr"

      # Results are committed with [skip ci], so the storage repository is told
      # directly. A repository that does not listen for ocr-done ignores it.
      - name: Notify the storage repository
        if: ${{ !cancelled() && steps.save.outputs.commit != '' }}
        env:
          GH_TOKEN: ${{ secrets.STORAGE_TOKEN }}
          STORAGE_REPO: ${{ secrets.STORAGE_REPO }}
          RESULT_COMMIT: ${{ steps.save.outputs.commit }}
          STORAGE_BRANCH: ${{ inputs.branch }}
        run: |
          jq -n --arg commit "$RESULT_COMMIT" --arg branch "$STORAGE_BRANCH" \
            '{event_type: "ocr-done", client_payload: {commit: $commit, branch: $branch}}' |
            gh api "repos/$STORAGE_REPO/dispatches" --input - >/dev/null 2>&1 ||
            echo "::warning::Could not notify the storage repository."
